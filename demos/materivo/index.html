<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta name="theme-color" content="#122b50">
<meta name="description" content="MATERIVO: porównanie dwóch koncepcji strony centrum budowlanego. Projekt pokazowy Zielonej Marki.">
<title>MATERIVO | Ekonomiczna i Pro | Zielona Marka</title>
<link rel="icon" href="assets/materivo-logo.svg" type="image/svg+xml">
<style>
*{box-sizing:border-box}
html,body{height:100%;min-height:100%;margin:0;overflow:hidden}
body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#eef3f8;color:#fff}
.app{height:100vh;height:100dvh;min-height:0;display:flex;flex-direction:column}
.switch-header{position:relative;z-index:10;min-height:68px;flex:0 0 auto;display:flex;gap:24px;align-items:center;justify-content:space-between;padding:10px max(18px,calc((100vw - 1310px)/2));background:#102b50;box-shadow:0 2px 12px rgba(4,15,35,.28)}
.project{display:flex;min-width:0;align-items:center;gap:13px}
.project-mark{width:33px;height:33px;display:grid;place-items:center;background:#fff;border-radius:5px;flex:0 0 auto;overflow:hidden}
.project-mark img{width:31px;height:31px;object-fit:contain}
.project-name{display:flex;flex-direction:column;gap:3px;min-width:0}
.project-name b{font-size:14px;font-weight:850;letter-spacing:.095em;line-height:1.1}
.project-name small{font-size:10px;color:#b9cce5;letter-spacing:.04em;line-height:1.3}
.switch-area{display:flex;gap:16px;align-items:center;justify-content:flex-end}
.switch-label{font-size:11px;color:#c5d5e8;white-space:nowrap;font-weight:600}
.segmented{display:flex;align-items:center;gap:3px;border:1px solid rgba(255,255,255,.29);background:#0a213e;padding:4px;border-radius:11px}
.segmented button{font-family:inherit;appearance:none;border:0;background:transparent;min-height:36px;min-width:126px;padding:8px 15px;border-radius:8px;color:#c5d5e8;font-size:12px;font-weight:750;cursor:pointer;transition:background .22s,color .22s,box-shadow .22s;white-space:nowrap}
.segmented button:hover{color:white;background:#23466f}
.segmented button[aria-pressed="true"]{background:#fff;color:#12335e;box-shadow:0 3px 10px #0004}
.segmented button:focus-visible{outline:3px solid #ffcc52;outline-offset:3px}
.stage{position:relative;flex:1 1 auto;min-height:0;background:#fff;isolation:isolate}
.site-pane{width:100%;height:100%;border:0;position:absolute;inset:0;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .26s ease,visibility .26s ease;background:white}
.site-pane.active{opacity:1;visibility:visible;pointer-events:auto;z-index:1}
@media(max-width:750px){.switch-header{padding:8px 11px;gap:6px;min-height:61px}.project{gap:7px}.project-mark{width:27px;height:27px}.project-mark img{width:25px;height:25px}.project-name b{font-size:11px}.project-name small{font-size:9px}.switch-label{display:none}.segmented button{min-width:88px;min-height:34px;font-size:11px;padding:6px 9px}}
@media(max-width:360px){.project-name small{display:none}.segmented button{min-width:77px;padding:6px 7px}}
@media(prefers-reduced-motion:reduce){.site-pane,.segmented button{transition:none}}
</style>
</head>
<body>
<div class="app">
<header class="switch-header" role="banner">
  <div class="project"><span class="project-mark"><img src="assets/materivo-logo.svg" alt=""></span><span class="project-name"><b>MATERIVO</b><small>Porównaj warianty strony</small></span></div>
  <div class="switch-area"><span class="switch-label">Wybierz wersję:</span>
    <div class="segmented" role="group" aria-label="Przełącz wersję strony MATERIVO">
      <button id="view-eko" type="button" aria-controls="frame-eko" aria-pressed="false">Ekonomiczna</button>
      <button id="view-pro" type="button" aria-controls="frame-pro" aria-pressed="false">Pro</button>
    </div>
  </div>
</header>
<main class="stage" aria-label="Podgląd wybranej wersji">
  <iframe class="site-pane" id="frame-eko" src="eko.html" title="MATERIVO: wersja ekonomiczna" loading="eager"></iframe>
  <iframe class="site-pane" id="frame-pro" src="pro.html" title="MATERIVO: wersja Pro" loading="eager"></iframe>
</main>
</div>
<script>
(()=>{
 'use strict';
 const tabs={eko:document.getElementById('view-eko'),pro:document.getElementById('view-pro')};
 const panes={eko:document.getElementById('frame-eko'),pro:document.getElementById('frame-pro')};
 let current='';
 function getView(){const selected=new URL(location.href).searchParams.get('widok');if(selected==='eko'||selected==='pro')return selected;return location.hostname.startsWith('materivo-pro')?'pro':'eko'}
 function apply(view,updateUrl){if(!panes[view])return;if(current===view)return;current=view;
   for(const name of ['eko','pro']){
      tabs[name].setAttribute('aria-pressed',String(name===view));
      panes[name].classList.toggle('active',name===view);
      panes[name].setAttribute('aria-hidden',String(name!==view));
      panes[name].tabIndex=name===view?0:-1;
   }
   if(updateUrl){const u=new URL(location.href);u.searchParams.set('widok',view);history.pushState({view},'',u)}
   document.title=`MATERIVO | ${view==='eko'?'Ekonomiczna':'Pro'} | Zielona Marka`;
 }
 tabs.eko.addEventListener('click',()=>apply('eko',true));
 tabs.pro.addEventListener('click',()=>apply('pro',true));
 window.addEventListener('popstate',()=>apply(getView(),false));
 apply(getView(),false);
})();
</script>
</body>
</html>
